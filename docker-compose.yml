# Local development services — generated by setup-project. Local use only.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivesafe
      POSTGRES_PASSWORD: drivesafe_local
      POSTGRES_DB: drivesafe_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./.auto-build/templates/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivesafe"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
