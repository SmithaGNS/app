openapi: 3.1.0
info:
  title: DriveSafe Admin Portal API
  version: 0.1.0
  description: |
    Source of truth between backend and frontend. Every response uses the envelope
    `{ message, data, errors }`. Validation failures (400) carry
    `errors: { validation: string[], fields: { [field]: string[] } }`; other failures may carry
    `errors: { code }` (machine code). Success responses have `errors: null`.
servers:
  - url: http://localhost:3000
    description: local development
tags:
  - name: auth
  - name: public
  - name: catalogue
  - name: users
    description: Portal users (SCR-20), app users (SCR-21), profile and change password (SCR-22).
  - name: health
  - name: dev
    description: Development/test only, absent (404) unless DEV_MAILBOX_ENABLED=true; never in production.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      required: [message, data, errors]
      properties:
        message: { type: string, examples: ["Incorrect username or password."] }
        data: { type: "null" }
        errors:
          oneOf:
            - type: "null"
            - type: object
              properties:
                code:
                  type: string
                  enum: [invalid_credentials, login_locked, otp_incorrect, otp_expired, otp_attempts_exceeded, otp_resend_wait, rate_limited, session_expired, unauthenticated, forbidden, reset_token_invalid, category_name_taken, category_protected, category_in_use, owner_name_taken, owner_in_use]
            - type: object
              properties:
                validation: { type: array, items: { type: string } }
                fields:
                  type: object
                  additionalProperties: { type: array, items: { type: string } }
    Role:
      type: string
      enum: [Administrator, ViolationManager]
    PortalUser:
      type: object
      required: [id, name, email, role, level, status, mustChangePassword, lastLoginAt, phone, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
        level: { type: [integer, "null"], minimum: 1, maximum: 3 }
        status: { type: string, enum: [Active, Inactive] }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: [string, "null"], format: date-time }
    Challenge:
      type: object
      required: [challengeId, purpose, destination, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        purpose: { type: string, enum: [login, reset] }
        destination: { type: string, description: Masked e-mail the code was sent to, examples: ["ad*************@test.local"] }
        resendAfterSeconds: { type: integer, examples: [60] }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds, examples: [900] }
        tokenType: { type: string, enum: [Bearer] }
    Envelope:
      type: object
      required: [message, data, errors]
      properties:
        message: { type: string }
        errors: { type: "null" }
    # ----- catalogue -----
    Category:
      type: object
      required: [id, name, description, ownerId, owner, isProtected, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 150 }
        ownerId: { type: [string, "null"], format: uuid }
        owner: { type: [object, "null"], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        isProtected: { type: boolean, description: "true for Other: cannot be deleted or renamed" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CategoryBody:
      type: object
      required: [name, description]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: "Trimmed, < > stripped, unique case-insensitively" }
        description: { type: string, minLength: 1, maxLength: 150 }
        ownerId: { type: [string, "null"], format: uuid, description: "Absent or null = no owner" }
    Owner:
      type: object
      required: [id, name, description, categoryCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 150 }
        categoryCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnerBody:
      type: object
      required: [name, description]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: "Trimmed, < > stripped, unique case-insensitively" }
        description: { type: string, minLength: 1, maxLength: 150 }
    Config:
      type: object
      required: [badgeName, updatedAt]
      properties:
        badgeName: { type: string, maxLength: 100 }
        updatedAt: { type: [string, "null"], format: date-time }
    CategoryPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Category" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    OwnerPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Owner" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
  parameters:
    CataloguePage: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    CataloguePageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
    # ---- users module (SCR-20/21/22) -------------------------------------------------------------
    PageMeta:
      type: object
      required: [total, perPage, currentPage, lastPage]
      properties:
        total: { type: integer, minimum: 0 }
        perPage: { type: integer, enum: [10, 25, 50, 100] }
        currentPage: { type: integer, minimum: 1 }
        lastPage: { type: integer, minimum: 1 }
    PortalUserAdmin:
      type: object
      required: [id, firstName, lastName, name, email, phoneCountryCode, phone, phoneDisplay, address, role, level, status, mustChangePassword, lastLoginAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, maxLength: 60 }
        lastName: { type: string, maxLength: 60 }
        name: { type: string, description: First + last name }
        email: { type: [string, "null"], description: "NULL for an invalid legacy e-mail; that user cannot sign in until an e-mail is set" }
        phoneCountryCode: { type: [string, "null"], pattern: "^[0-9]{1,4}$", examples: ["1"] }
        phone: { type: [string, "null"], pattern: "^[0-9]{7,15}$", description: National digits only }
        phoneDisplay: { type: [string, "null"], examples: ["+1 876 3831676"] }
        address: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        level: { type: [integer, "null"], minimum: 1, maximum: 3 }
        status: { type: string, enum: [Active, Inactive] }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    PortalUserWrite:
      type: object
      required: [firstName, lastName, email, phone, role]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60, description: "Letters, digits, space, apostrophe, hyphen, period; `<>` stripped" }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, maxLength: 254, pattern: "^\\S+@\\S+\\.\\S+$", description: Stored lower-cased; unique }
        phoneCountryCode: { type: [string, "null"], pattern: "^\\+?[0-9]{1,4}$", description: Leading + accepted and dropped }
        phone: { type: string, pattern: "^[0-9]{7,15}$", description: Unique together with the country code }
        address: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        level: { type: [integer, "null"], minimum: 1, maximum: 3 }
    CreatePortalUser:
      allOf:
        - $ref: "#/components/schemas/PortalUserWrite"
        - type: object
          required: [password]
          properties:
            password: { type: string, minLength: 12, maxLength: 128, description: "Upper + lower + digit + symbol (shared policy). The user must change it at first sign-in." }
    UpdatePortalUser:
      allOf:
        - $ref: "#/components/schemas/PortalUserWrite"
        - type: object
          properties:
            password: { type: [string, "null"], minLength: 12, maxLength: 128, description: "Blank/omitted keeps the current password; a value revokes the user's sessions and forces a change" }
            status: { type: string, enum: [Active, Inactive] }
    AppUserView:
      type: object
      required: [id, firstName, lastName, email, phoneMasked, pointsEarned, pointsRedeemed, createdAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phoneMasked: { type: string, description: "Every digit but the last three is a bullet; country code readable", examples: ["+1 \u2022\u2022\u2022\u2022\u2022\u2022\u2022567"] }
        pointsEarned: { type: integer, minimum: 0, maximum: 1000000 }
        pointsRedeemed: { type: integer, minimum: 0, maximum: 1000000, description: Never greater than pointsEarned }
        createdAt: { type: string, format: date-time }
    AppUserWrite:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: [string, "null"], maxLength: 60 }
        lastName: { type: [string, "null"], maxLength: 60 }
        email: { type: [string, "null"], maxLength: 254, description: Optional; unique among app users }
        phoneCountryCode: { type: [string, "null"], pattern: "^\\+?[0-9]{1,4}$" }
        phone: { type: string, pattern: "^[0-9]{7,15}$", description: Required on create; on update omitted = unchanged }
        pointsEarned: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        pointsRedeemed: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    RevealedPhone:
      type: object
      required: [phoneCountryCode, phone, phoneDisplay]
      properties:
        phoneCountryCode: { type: [string, "null"] }
        phone: { type: string }
        phoneDisplay: { type: string, examples: ["+1 876 1234567"] }
    UpdateProfile:
      type: object
      required: [firstName, lastName, phone]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        phoneCountryCode: { type: [string, "null"] }
        phone: { type: string, pattern: "^[0-9]{7,15}$" }
        address: { type: [string, "null"], maxLength: 200 }
    ChangePassword:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128, description: Shared password policy; must differ from the current one }
        confirmPassword: { type: string, description: Must equal newPassword }
  responses:
    Conflict:
      description: "Duplicate e-mail/phone (400-style `errors.fields.{field}[]`) or a business rule (`errors.code`: cannot_delete_self | last_administrator | email_missing)"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Record not found or soft-deleted (errors.code not_found)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    PasswordChangeRequired:
      description: Forbidden until the first-login password change is done (errors.code password_change_required) or role lacks the permission (forbidden)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ValidationError:
      description: Validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unauthenticated:
      description: Missing/invalid token, revoked session, or idle timeout (errors.code unauthenticated | session_expired)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Role lacks the permission (errors.code forbidden)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    TooManyRequests:
      description: Rate limited / throttled (errors.code rate_limited | login_locked | otp_attempts_exceeded | otp_resend_wait)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    CatalogueConflict:
      description: "Conflict (errors.code: category_name_taken | category_protected | category_in_use | owner_name_taken | owner_in_use)"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    CatalogueNotFound:
      description: Category or owner not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness (unauthenticated, outside /v1)
      security: []
      x-roles: [public]
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] } } } } }
  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Step 1 - check credentials and start an OTP challenge (SCR-00)
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 254, description: "Account e-mail; trimmed, lower-cased, < > stripped" }
                password: { type: string, minLength: 1, maxLength: 128, description: Not trimmed }
      responses:
        "200":
          description: Code sent to the registered e-mail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Challenge" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Incorrect username or password (generic; also unknown/inactive/deleted account). errors.code invalid_credentials
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [auth]
      summary: Step 2 - verify the 6-digit code (SCR-02). Login challenge returns tokens; reset challenge delivers a reset link by e-mail.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: |
            purpose=login -> TokenPair + user; purpose=reset -> { purpose, destination, linkExpiresInMinutes }.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        oneOf:
                          - allOf:
                              - $ref: "#/components/schemas/TokenPair"
                              - type: object
                                required: [purpose, user]
                                properties:
                                  purpose: { type: string, enum: [login] }
                                  user: { $ref: "#/components/schemas/PortalUser" }
                          - type: object
                            required: [purpose, destination, linkExpiresInMinutes]
                            properties:
                              purpose: { type: string, enum: [reset] }
                              destination: { type: string }
                              linkExpiresInMinutes: { type: integer, examples: [30] }
        "400":
          description: Validation (code must be 6 digits - "Enter all 6 digits of the code."), otp_incorrect ("That code is incorrect."), otp_expired ("That code has expired. Request a new one.")
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Too many attempts (otp_attempts_exceeded) - "Too many attempts. Request a new code." (6th attempt on a code with 5 wrong entries) or IP rate limit
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /v1/auth/otp/resend:
    post:
      operationId: authOtpResend
      tags: [auth]
      summary: Issue a new code on the same challenge (allowed 60 s after the previous one)
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId]
              properties:
                challengeId: { type: string, format: uuid }
      responses:
        "200":
          description: New code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          challengeId: { type: string, format: uuid }
                          resendAfterSeconds: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/forgot:
    post:
      operationId: authForgot
      tags: [auth]
      summary: Start password reset (SCR-01). Same response whether or not the e-mail exists.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 5, maxLength: 254, pattern: "^\\S+@\\S+\\.\\S+$" }
      responses:
        "200":
          description: Challenge (purpose=reset)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Challenge" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [auth]
      summary: Set a new password using the single-use token from the reset link (30 min). Revokes all sessions.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 20, maxLength: 200 }
                newPassword: { type: string, minLength: 12, maxLength: 128, description: "Must contain upper-case, lower-case, a digit and a symbol" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: "null" } }
        "400":
          description: Validation (password policy) or reset_token_invalid
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: Rotate the refresh token; the previous one stops working
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 20, maxLength: 200 }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/TokenPair" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: End the current session (SCR-04); access and refresh tokens stop working
      security: [{ bearerAuth: [] }]
      x-roles: [Administrator, ViolationManager]
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: "null" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Signed-in identity for the shell header/sidebar (SCR-04). Permission profile:read.
      security: [{ bearerAuth: [] }]
      x-roles: [Administrator, ViolationManager]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/PortalUser" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/public/config:
    get:
      operationId: publicConfig
      tags: [public]
      summary: Badge name shown on SCR-00/01/02 before sign-in
      security: []
      x-roles: [public]
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        required: [badgeName]
                        properties:
                          badgeName: { type: string, examples: ["Ministry of Transport and Mining"] }
  /v1/public/feedback:
    post:
      operationId: publicFeedback
      tags: [public]
      summary: Store an anonymous feedback submission (SCR-03). Rate limited to 5 per 15 min per IP.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, message]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, minLength: 5, maxLength: 254, pattern: "^\\S+@\\S+\\.\\S+$" }
                subject:
                  type: string
                  enum: [general_feedback, report_problem, feature_request, account_login_issue]
                  default: general_feedback
                  description: "General feedback | Report a problem | Feature request | Account / login issue"
                message: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/dev/mailbox:
    get:
      operationId: devMailbox
      tags: [dev]
      summary: "DEV/TEST ONLY: latest mock e-mails (OTP codes, reset tokens) for a recipient. 404 unless DEV_MAILBOX_ENABLED=true."
      security: []
      x-roles: [public]
      parameters:
        - { name: to, in: query, required: true, schema: { type: string, format: email } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items:
                              type: object
                              properties:
                                kind: { type: string, enum: [otp, reset-link] }
                                to: { type: string }
                                code: { type: string }
                                link: { type: string }
                                token: { type: string }
                                createdAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { description: Disabled }

  # ---- contact module (SCR-13) ----
  /v1/contact-messages:
    get:
      operationId: contactMessagesList
      tags: [contact]
      summary: Citizen Contact Us messages, newest first, server paging and search (SCR-13)
      security: [{ bearerAuth: [] }]
      x-roles: [Administrator, ViolationManager]
      x-permission: contact:read
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
        - { name: search, in: query, description: "Case-insensitive; matches name, email, message, response", schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: One page. items is empty when nothing matches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        required: [items, meta]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: [id, name, email, message, createdAt, response, repliedAt, repliedBy]
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                email: { type: string }
                                message: { type: string }
                                createdAt: { type: string, format: date-time }
                                response: { type: [string, "null"] }
                                repliedAt: { type: [string, "null"], format: date-time }
                                repliedBy:
                                  oneOf:
                                    - { type: "null" }
                                    - { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
                          meta:
                            type: object
                            required: [page, pageSize, total, totalPages]
                            properties:
                              page: { type: integer }
                              pageSize: { type: integer }
                              total: { type: integer }
                              totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/contact-messages/{id}:
    get:
      operationId: contactMessagesGet
      tags: [contact]
      summary: One message (fills the reply modal)
      security: [{ bearerAuth: [] }]
      x-roles: [Administrator, ViolationManager]
      x-permission: contact:read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Same item shape as the list (data = item)" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown, deleted or malformed id (message "Message not found.") }
  /v1/contact-messages/{id}/reply:
    put:
      operationId: contactMessagesReply
      tags: [contact]
      summary: Store or replace the single reply (replier and server time recorded; nothing is sent to the citizen)
      security: [{ bearerAuth: [] }]
      x-roles: [Administrator, ViolationManager]
      x-permission: contact:reply
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response]
              properties:
                response: { type: string, minLength: 1, maxLength: 1000, description: "Trimmed; < and > stripped; empty after cleaning gives 'Response is required.'" }
      responses:
        "200": { description: 'Updated item (data = item); message "Reply sent to {name}."' }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown, deleted or malformed id }
  /v1/public/contact-messages:
    post:
      operationId: contactMessagesIntake
      tags: [contact]
      summary: Citizen app intake stub. Rate limited to 10 per 15 min per IP.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, message]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, minLength: 5, maxLength: 254, pattern: "^\\S+@\\S+\\.\\S+$" }
                message: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "201": { description: "Stored (data = { id })" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

