openapi: 3.1.0
info:
  title: drivesafe API
  version: 0.1.0
servers:
  - url: http://localhost:3000/v1
paths: {}
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Envelope:
      type: object
      properties:
        message: { type: string }
        data: {}
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
        lastPage: { type: integer }
